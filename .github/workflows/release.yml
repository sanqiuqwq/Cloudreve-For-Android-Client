name: Release APK

on:
  # 在 GitHub 上发布 Release 时自动触发
  release:
    types: [published]
  # 支持手动重跑（补传产物用）
  workflow_dispatch:
    inputs:
      tag:
        description: 目标 Release 的 tag
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      # 未配置签名密钥时会退回 debug 签名，产物仍可直接安装
      - name: Restore signing keystore
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PabiSplits --console=plain

      - name: Collect and rename APKs
        run: |
          set -euo pipefail
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p artifacts
          shopt -s nullglob
          for apk in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" .apk)
            abi=${abi#app-}
            abi=${abi%-release}
            cp "$apk" "artifacts/Cloudreve-${version}-${abi}.apk"
          done
          ls -lh artifacts

      - name: Upload APKs to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: artifacts/*.apk
          fail_on_unmatched_files: true